[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-ingest-core"
version = "0.1.0"
description = "本機優先的 Podcast 擷取、轉錄、研究 artifacts、搜尋與 MCP workflow 核心。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "faster-whisper>=1.1.0",
    "mcp[cli]>=1.27,<2",
    "PyYAML>=6.0",
    "requests>=2.31",
    # Spec 036：X 影片取得。兩者都採惰性匯入，缺套件時由
    # XVideoIngestDependencyError 說明如何安裝，不會拖垮其他功能。
    "yt-dlp>=2024.1.0",
    "av>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Repo-local basetemp: the default %TEMP%\pytest-of-* on this machine has broken
# ACLs, and a long basetemp can push artifact paths past the Windows 260-char
# MAX_PATH. Run pytest from the repo root. (.pytest-tmp/ is gitignored.)
#
# The Hermes 029-034 chain is excluded from the default run. Those packages are
# Blocked (see specs/README.md), and they do not verify through a bare pytest:
# each ships its own offline entry point (scripts/verify_spec_0NN*.py) that runs
# a fixed subset under a runtime sentinel plugin, and several of their
# assertions pin the byte length of shared documents -- README.md,
# docs/roadmap.md, specs/README.md, pyproject.toml -- to the snapshot taken when
# that spec was reviewed. Specs 035-042 have since changed those documents, so a
# bare run reports failures that say nothing about the podcast pipeline.
#
# Nothing is hidden. --ignore does not apply to an explicitly named path, so
# `python -m pytest tests/test_spec_032_hermes_g2_docs.py` still runs them, and
# docs/install-and-porting.md already documented this same list.
addopts = [
    "--basetemp=.pytest-tmp/run",
    "--ignore=tests/test_spec_029_offline.py",
    "--ignore=tests/test_spec_030_g1r_offline_remediation.py",
    "--ignore=tests/test_spec_031_hermes_g2_docs.py",
    "--ignore=tests/test_spec_032_hermes_g2_docs.py",
    "--ignore=tests/test_spec_033_hermes_source_audit_docs.py",
    "--ignore=tests/test_spec_034_h4_repair.py",
    "--ignore=tests/test_spec_034_final_acceptance.py",
    "--ignore=tests/test_mcp_http_transport.py",
    "--ignore=tests/test_hermes_runtime_capability.py",
]
markers = [
    "product_regression_only: synthetic named-public-seam regression with no live market/provider request",
]
