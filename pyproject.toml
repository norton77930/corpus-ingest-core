[build-system]
# >=77 for PEP 639 (`license = "MIT"` as an SPDX string + license-files).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-ingest-core"
version = "0.2.0"
description = "Local-first ingestion, transcription, research artifacts, search, and MCP workflows for spoken-word corpora."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Norton" }]
keywords = ["mcp", "transcription", "whisper", "podcast", "rag", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "feedparser>=6.0",
    "faster-whisper>=1.1.0",
    "mcp[cli]>=1.27,<3",
    "PyYAML>=6.0",
    "requests>=2.31",
    # Spec 036：X 影片取得。兩者都採惰性匯入，缺套件時由
    # XVideoIngestDependencyError 說明如何安裝，不會拖垮其他功能。
    "yt-dlp>=2024.1.0",
    "av>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Upper bounds on the two linters, matching the mcp pin's house style. Both
    # add checks in ordinary releases, so an unbounded floor lets CI go red on a
    # commit that changed nothing -- which is how mypy 2.x found a real bug here
    # while the authoring machine still had 1.7 and reported a clean run.
    # Dependabot proposes the bump; the bump is where new findings get read.
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
]

[project.urls]
Homepage = "https://github.com/norton77930/corpus-ingest-core"
Repository = "https://github.com/norton77930/corpus-ingest-core"
Issues = "https://github.com/norton77930/corpus-ingest-core/issues"
Changelog = "https://github.com/norton77930/corpus-ingest-core/blob/main/CHANGELOG.md"

# Only the two MCP entry points are installed as commands. The 46 scripts under
# scripts/ stay `python scripts/<name>.py`: they are a thin argparse layer over
# the core, they change with the specs, and promoting them would freeze 46
# command names as public API. An agent needs exactly one of these to connect.
#
# Both MUST point at mcp_server, not mcp_runtime. Tool registration is an import
# side effect of the mcp_tools_* group modules, and mcp_server is the only thing
# that imports them -- mcp_runtime owns the bare FastMCP instance and knows
# nothing about tools. Targeting mcp_runtime:run here produced a server that
# started cleanly and advertised zero tools.
# tests/test_console_entry_points.py runs each command in a fresh process and
# fails if the registry is not the full 25.
[project.scripts]
corpus-ingest-mcp = "corpus_ingest_core.mcp_server:run"
corpus-ingest-mcp-http = "corpus_ingest_core.mcp_server:run_streamable_http"

[tool.ruff]
# 120, not 88: the existing code is written to it, and E501 is excluded below
# anyway. This value only shapes what ruff format would do when it is adopted.
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line-too-long) is off on purpose. It accounts for 2018 of the 2549
# violations found when this gate was first switched on, and every one of them
# is a formatting question, not a correctness one. Reflowing them belongs in a
# single `ruff format` commit that touches nothing else -- mixed into a feature
# diff it would bury the change under whitespace.
ignore = ["E501"]

# F401 is reported but never auto-fixed here. This codebase re-exports across
# module boundaries -- semantic_summarizer imports SEMANTIC_API_COST_ACK purely
# so stock_lens_synthesis can import it back out -- and `ruff check --fix`
# cannot see that from inside one file. It deleted exactly that binding on the
# first run and broke the package import. Every F401 gets read by a human.
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
# The facade re-exports tool functions, envelopes, and dependency-module
# aliases so that clients and tests can reach every one of them through this
# one module; see its docstring. Ruff sees 85 unused imports. They are the
# contract, and tests/test_mcp_server_facade_boundary.py fails if they go.
"src/corpus_ingest_core/mcp_server.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["corpus_ingest_core"]

[tool.mypy]
# No python_version pin. It was "3.11", and the 3.12 CI job then analysed
# that interpreter's numpy stubs under 3.11 rules and died on a `type`
# statement it could not parse. Each job should check against the version
# it is actually running.
files = ["src"]
# Third-party packages here ship no stubs (faster_whisper, feedparser, av,
# yt_dlp, mcp). Without this every import of them is an error and the real
# findings drown.
ignore_missing_imports = true
# Deliberately not strict. Turning on disallow_untyped_defs today would report
# thousands of errors and the gate would be switched straight back off; the
# baseline below is the thing that shrinks first.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Baseline, not an exemption. mypy finds 60 errors across these 10 modules; the
# other 74 under src/ are already clean and are gated from now on, so a new
# module starts type-checked and cannot join this list without an edit here.
# Shrink it: delete a line, run mypy, fix what it reports. The list is small on
# purpose so that is a normal-sized piece of work rather than a project.
[[tool.mypy.overrides]]
module = [
    "corpus_ingest_core.artifact_lock",
    "corpus_ingest_core.corpus_episode_completion_workflow_runner",
    "corpus_ingest_core.corpus_index",
    "corpus_ingest_core.latest_episode_verified_research_report_workflow_runner",
    "corpus_ingest_core.mcp_tools_side_effect",
    "corpus_ingest_core.mcp_tools_stock_lens",
    "corpus_ingest_core.mcp_verified_research_report_catalog",
    "corpus_ingest_core.verified_research_lineage",
    "corpus_ingest_core.verified_research_report_catalog",
    "corpus_ingest_core.verified_research_report_source_revalidation",
]
ignore_errors = true

[tool.coverage.run]
source = ["corpus_ingest_core"]
# branch = true does not work here. Several tests spawn subprocesses from a
# temporary cwd, so those children never find this file and measure in
# statement mode; combining them with the parent's branch data fails outright
# with "Can't combine statement coverage data with branch data". Turning it on
# would need COVERAGE_RCFILE plumbed through every subprocess launch, which is
# a bigger change than the extra signal is worth today.

[tool.coverage.report]
# Measured 89% on windows-latest (13329 statements, 1511 uncovered). The floor
# sits below that on purpose: artifact_lock, secure_local_snapshot and
# verified_research_report_catalog branch on os.name == "nt", so each platform
# leaves the other's branch uncovered and the ubuntu number will not match the
# windows one. 85 is a real floor -- it fails on a genuine regression -- with
# just enough slack that a platform split does not turn CI red for nothing.
# Ratchet it up once both platforms have reported a few times.
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Repo-local basetemp: the default %TEMP%\pytest-of-* on the authoring machine
# has broken ACLs, and a long basetemp can push artifact paths past the Windows
# 260-char MAX_PATH. Run pytest from the repo root. (.pytest-tmp/ is gitignored.)
#
# There is no --ignore list. Every test in tests/ runs on a bare `python -m
# pytest`; if one goes red it is telling you something about this project.
addopts = [
    "--basetemp=.pytest-tmp/run",
]
markers = [
    "product_regression_only: synthetic named-public-seam regression with no live market/provider request",
]
