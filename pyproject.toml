[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-ingest-core"
version = "0.1.0"
description = "本機優先的 Podcast 擷取、轉錄、研究 artifacts、搜尋與 MCP workflow 核心。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "faster-whisper>=1.1.0",
    "mcp[cli]>=1.27,<2",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Repo-local basetemp: the default %TEMP%\pytest-of-* on this machine has broken
# ACLs, and a long basetemp can push artifact paths past the Windows 260-char
# MAX_PATH. Run pytest from the repo root. (.pytest-tmp/ is gitignored.)
addopts = "--basetemp=.pytest-tmp/run"
